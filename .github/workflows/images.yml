name: Images

# Builds the four build images once and publishes them to GHCR, so the jobs in
# ci.yml pull them instead of building on every PR (and no longer fill the
# Actions cache with buildkit layers, which evicted the ccache entries).

on:
  push:
    branches: [main]
    paths:
      - tools/Dockerfile.build
      - tools/Dockerfile.ui
      - tools/Dockerfile.rtsan
      - tools/Dockerfile.plugins
      - audio-stack/pipewire-sonora.conf
      - tools/Dockerfile.labwc
      - tools/Dockerfile.labwc-input
      - tools/Dockerfile.systemd-test
      - tools/Dockerfile.runtime
      - tools/Dockerfile.bwfreaders
      - iso/auto/config
      - iso/config/archives/sonora-backports.list.chroot
      - iso/config/archives/sonora-backports.pref.chroot
      - iso/config/archives/sonora-snapshot.conf.chroot
      - tools/test-engine-entrypoint.sh
      - tools/verify-recording.py
      - tools/test-quantum-entrypoint.sh
      - tools/jack-quantum-probe.py
      - .github/workflows/images.yml
  workflow_dispatch:
  # Weekly, to pick up base image security updates.
  schedule:
    - cron: '17 3 * * 1'

concurrency:
  group: images
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Image ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sonora-build
            dockerfile: tools/Dockerfile.build
            context: tools
          - name: sonora-ui
            dockerfile: tools/Dockerfile.ui
            context: .
          - name: sonora-rtsan
            dockerfile: tools/Dockerfile.rtsan
            context: tools
          - name: sonora-plugins
            dockerfile: tools/Dockerfile.plugins
            context: tools
          # The names below are the tags the test scripts use, without :trixie.
          - name: sonora-labwc-test
            dockerfile: tools/Dockerfile.labwc
            context: tools
            snapshot: true
          - name: sonora-labwc-input
            dockerfile: tools/Dockerfile.labwc-input
            context: tools
          - name: sonora-systemd-test
            dockerfile: tools/Dockerfile.systemd-test
            context: tools
          - name: sonora-bwf-readers
            dockerfile: tools/Dockerfile.bwfreaders
            context: tools
          - name: sonora-runtime
            dockerfile: tools/Dockerfile.runtime
            context: .
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        env:
          IMAGE: ghcr.io/alesimoes/${{ matrix.name }}
        run: |
          extra=()
          if [ "${{ matrix.snapshot }}" = true ]; then
            # The same value tools/test-labwc-kiosk.sh passes when it builds locally.
            snap="$(sed -nE 's/^SONORA_SNAPSHOT=([0-9]{8}T[0-9]{6}Z)$/\1/p' iso/auto/config)"
            [ -n "$snap" ] || { echo "no SONORA_SNAPSHOT in iso/auto/config" >&2; exit 1; }
            extra=(--build-arg "SNAP=$snap")
          fi
          docker build --label org.sonora=1 "${extra[@]}" \
            --label org.opencontainers.image.source=https://github.com/alesimoes/sonora-os \
            -t "$IMAGE:trixie" -t "$IMAGE:${GITHUB_SHA}" \
            -f "${{ matrix.dockerfile }}" "${{ matrix.context }}"
          docker push "$IMAGE:trixie"
          docker push "$IMAGE:${GITHUB_SHA}"
