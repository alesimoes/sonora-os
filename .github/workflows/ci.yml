name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: Engine build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libjack-jackd2-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

  ui:
    name: Qt interface build and headless tests
    # Ubuntu's own Qt 6 (6.4) from apt, not tools/Dockerfile.ui: the image
    # carries PipeWire, cage and grim for screenshots and --measure, which
    # this job does not run, and building it costs more than the whole job.
    # 6.4 is the floor ui/qt/CMakeLists.txt asks for, so this also proves the
    # floor; the image (trixie, 6.8) proves the shipped version.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The QML modules are listed one by one because --no-install-recommends
      # drops QtQml.WorkerScript, and the shell then fails to load.
      - name: Install the toolchain and Qt 6
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libjack-jackd2-dev \
            qt6-base-dev qt6-declarative-dev libqt6opengl6-dev \
            qml6-module-qtquick qml6-module-qtquick-window \
            qml6-module-qtquick-layouts qml6-module-qtquick-controls \
            qml6-module-qtqml-workerscript qml6-module-qtquick-templates \
            libgl1-mesa-dri libglx-mesa0 libegl-mesa0 xvfb xauth

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      # ui/qt skips itself when Qt or xvfb-run is missing, which is right for
      # the engine job and wrong here: a green job that ran no UI test would
      # say the interface was tested. So the tests must be registered.
      - name: The UI tests are registered, the pixel test included
        run: |
          listed=$(ctest --test-dir build -N)
          for t in ui_meter_model ui_keys ui_shell ui_render; do
            grep -q " $t\$" <<<"$listed" || { echo "::error::$t is not registered"; exit 1; }
          done

      - name: Build
        run: cmake --build build -j"$(nproc)"

      # The pixel test (ui_render) runs under xvfb-run on llvmpipe, as
      # registered in ui/qt/CMakeLists.txt. --measure is not run here: it is
      # slow and its figures are only meaningful on the target.
      - name: Test
        run: QT_QPA_PLATFORM=offscreen ctest --test-dir build --output-on-failure

  sanitizers:
    name: Thread and address sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libjack-jackd2-dev

      # The ring buffer is the one piece of genuinely concurrent code in the
      # tree, so a data race in it is worth a dedicated job. TSan is the only
      # thing that reliably catches a wrong memory ordering.
      # Newer kernels randomise more address bits than TSan's shadow mapping
      # expects, and it aborts with "unexpected memory mapping" before running
      # a single test. That looks like a test failure and is not one, so pin
      # it rather than letting the job go flaky.
      - name: Make ASLR compatible with the sanitizers
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Build with TSan
        run: |
          cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -g"
          cmake --build build-tsan -j"$(nproc)"

      - name: Run under TSan
        run: ctest --test-dir build-tsan --output-on-failure

      - name: Build with ASan and UBSan
        run: |
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g"
          cmake --build build-asan -j"$(nproc)"

      - name: Run under ASan and UBSan
        run: ctest --test-dir build-asan --output-on-failure

  record:
    name: Records audio against PipeWire
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The unit tests cover the data path; this covers the thing the product
      # is for. It caught an engine that recorded silence from unconnected
      # ports and reported success, which no unit test would have.
      - name: Record and verify
        run: tools/test-engine-docker.sh

  interop:
    name: BWF files read back by third-party tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Phase 1 promises the takes open in another DAW at the right timecode.
      # ffprobe, soxi, libsndfile, mediainfo and a headless Ardour 8 judge two
      # recorded takes, the second starting off zero. About two minutes, most
      # of it installing Ardour into the reader image.
      - name: Record two takes and read them back
        run: tools/test-bwf-interop.sh

  modes:
    name: Executable bits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # These files are committed from Windows, where there is no exec bit, so
      # git records 100644 unless someone sets it explicitly. live-build
      # silently ignores a non-executable auto/config and hooks, which would
      # cost us the RT kernel flavour on a fresh clone and look like nothing
      # at all. Checked rather than remembered.
      - name: Every script must be executable in the index
        run: |
          missing=0
          for f in tools/*.sh tools/*.py iso/auto/config                    iso/config/hooks/normal/*.hook.chroot                    iso/config/includes.chroot/usr/local/bin/*; do
            mode=$(git ls-files -s "$f" | cut -d' ' -f1)
            if [ "$mode" != "100755" ]; then
              echo "::error file=$f::mode $mode, expected 100755."
              echo "  fix with: git update-index --chmod=+x $f"
              missing=1
            fi
          done
          exit "$missing"

  progress:
    name: Progress catalogue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # PROGRESS.md is generated; a PR that flips an item without regenerating
      # it, or marks one done without evidence, fails here.
      - name: Catalogue valid and PROGRESS.md current
        run: python3 tools/progress.py --check

  shellcheck:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check
        run: shellcheck tools/*.sh iso/auto/config iso/config/hooks/normal/*.hook.chroot
