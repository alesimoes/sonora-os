name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: Engine build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libjack-jackd2-dev locales
          # The comma-decimal regression tests (common/json, common/model,
          # ui/keymap) skip without it.
          sudo locale-gen de_DE.UTF-8

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

  ui:
    name: Qt interface build and headless tests
    # In tools/Dockerfile.ui, the image tools/build-ui.sh uses: Debian trixie
    # and its Qt 6.8, the Qt the product ships. ui/qt needs 6.7 (QSGTextNode,
    # QFont::Tag); Ubuntu 24.04's apt has 6.4, on which ui/qt skipped itself
    # and the job ran no UI test at all. The image layers are cached in the
    # Actions cache, so only a change to the Dockerfile pays for the install.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the sonora-ui image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/Dockerfile.ui
          tags: sonora-ui:trixie
          labels: org.sonora=1
          load: true
          cache-from: type=gha,scope=sonora-ui
          cache-to: type=gha,scope=sonora-ui,mode=max

      # tools/build-ui-entrypoint.sh fails before building if any UI test is
      # not registered: ui/qt skips itself when Qt is missing or too old, and
      # a green job that ran no UI test would say the interface was tested.
      # The pixel test (ui_render) runs under xvfb-run on llvmpipe. --measure
      # is not run here: it is slow and only meaningful on the target.
      - name: Build and test, the UI tests included
        env:
          SONORA_UI_IMAGE_BUILT: "1"
        run: tools/build-ui.sh

  sanitizers:
    name: Thread and address sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libjack-jackd2-dev locales
          # The comma-decimal regression tests (common/json, common/model,
          # ui/keymap) skip without it.
          sudo locale-gen de_DE.UTF-8

      # The ring buffer is the one piece of genuinely concurrent code in the
      # tree, so a data race in it is worth a dedicated job. TSan is the only
      # thing that reliably catches a wrong memory ordering.
      # Newer kernels randomise more address bits than TSan's shadow mapping
      # expects, and it aborts with "unexpected memory mapping" before running
      # a single test. That looks like a test failure and is not one, so pin
      # it rather than letting the job go flaky.
      - name: Make ASLR compatible with the sanitizers
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Build with TSan
        run: |
          cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -g"
          cmake --build build-tsan -j"$(nproc)"

      - name: Run under TSan
        run: ctest --test-dir build-tsan --output-on-failure

      - name: Build with ASan and UBSan
        run: |
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g"
          cmake --build build-asan -j"$(nproc)"

      - name: Run under ASan and UBSan
        run: ctest --test-dir build-asan --output-on-failure

  record:
    name: Records audio against PipeWire
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The unit tests cover the data path; this covers the thing the product
      # is for. It caught an engine that recorded silence from unconnected
      # ports and reported success, which no unit test would have.
      - name: Record and verify
        run: tools/test-engine-docker.sh

  interop:
    name: BWF files read back by third-party tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Phase 1 promises the takes open in another DAW at the right timecode.
      # ffprobe, soxi, libsndfile, mediainfo and a headless Ardour 8 judge two
      # recorded takes, the second starting off zero. About two minutes, most
      # of it installing Ardour into the reader image.
      - name: Record two takes and read them back
        run: tools/test-bwf-interop.sh

  quantum:
    name: Quantum and rate stay pinned
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Under ADR-0007 M2 a block-size or rate change mid-take ends the take.
      # This tries every client-side route we know of to move the graph off
      # 128 frames at 48 kHz, against the drop-in the image ships. No engine
      # build is needed, so it costs one container image and about a minute.
      - name: Try to move the graph
        run: tools/test-quantum-pin.sh

  plugins:
    name: Plugin host against real LV2 plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The engine job has no lilv, so plugins/host is skipped there. This
      # builds the whole root in the sonora-plugins image (lilv, eg-amp,
      # x42-dpl, the LSP limiter) and runs every test, including a plugin
      # that segfaults, one that sleeps past the deadline and one that
      # writes outside its buffers. A missing Debian plugin fails the job
      # rather than skipping (SONORA_PLUGIN_TESTS_ALLOW_SKIP is OFF).
      - name: Build and test the plugin host
        run: tools/build-plugins.sh

  modes:
    name: Executable bits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # These files are committed from Windows, where there is no exec bit, so
      # git records 100644 unless someone sets it explicitly. live-build
      # silently ignores a non-executable auto/config and hooks, which would
      # cost us the RT kernel flavour on a fresh clone and look like nothing
      # at all. Checked rather than remembered.
      - name: Every script must be executable in the index
        run: |
          missing=0
          for f in tools/*.sh tools/*.py iso/auto/config                    iso/config/hooks/normal/*.hook.chroot                    iso/config/includes.chroot/usr/local/bin/*; do
            mode=$(git ls-files -s "$f" | cut -d' ' -f1)
            if [ "$mode" != "100755" ]; then
              echo "::error file=$f::mode $mode, expected 100755."
              echo "  fix with: git update-index --chmod=+x $f"
              missing=1
            fi
          done
          exit "$missing"

  progress:
    name: Progress catalogue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A done item without evidence, or a doing item without a branch,
      # fails here. PROGRESS.md is not compared: it is regenerated on main.
      - name: Catalogue valid
        run: python3 tools/progress.py --check

      # Every PR that regenerated PROGRESS.md conflicted with every other
      # queued PR, so only the publish-progress job below writes it.
      - name: PR leaves PROGRESS.md alone
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # The checked-out ref is the PR merged into *current* main, which
          # carries main's own PROGRESS.md regenerations; compare the PR head.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --name-only "$BASE_SHA"..."$HEAD_SHA" | grep -qx 'planning/PROGRESS.md'; then
            echo "::error file=planning/PROGRESS.md::PRs must not change PROGRESS.md; CI regenerates it on main after the merge."
            echo "  fix with: git checkout origin/main -- planning/PROGRESS.md"
            exit 1
          fi

  publish-progress:
    name: Regenerate PROGRESS.md on main
    # Only after a merge, never in a PR. The bot's own commit carries
    # [skip ci], and the actor check stops a loop should that ever be lost.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.actor != 'github-actions[bot]'
    needs: progress
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Two merges in quick succession must not race to push; the later run
    # regenerates from the later main, so the earlier one can be dropped.
    concurrency:
      group: publish-progress
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Regenerate
        run: python3 tools/progress.py --markdown

      - name: Commit if it changed
        run: |
          if git diff --quiet -- planning/PROGRESS.md; then
            echo "PROGRESS.md already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add planning/PROGRESS.md
          git commit -m "Regenerate PROGRESS.md [skip ci]"
          git push origin HEAD:main

  shellcheck:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Check
        run: shellcheck tools/*.sh iso/auto/config iso/config/hooks/normal/*.hook.chroot

      # The image installs the copies under iso/, not audio-stack/ itself, so
      # an edit that skipped tools/sync-audio-stack.sh would ship the old
      # tuning while every container test (which reads audio-stack/) passed.
      - name: The image's audio-stack copies match audio-stack/
        run: |
          dest=iso/config/includes.chroot/usr/share/sonora
          drift=0
          for f in audio-stack/*; do
            name=$(basename "$f")
            [ "$name" = README.md ] && continue
            if ! cmp -s "$f" "$dest/$name"; then
              echo "::error file=$dest/$name::not byte-identical to $f."
              echo "  fix with: tools/sync-audio-stack.sh"
              drift=1
            fi
          done
          exit "$drift"
