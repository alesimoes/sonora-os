name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

# A new push to a PR cancels its stale run. Runs on main are never cancelled:
# each merge keeps its own result, so the group is unique per run there.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      core: ${{ steps.filter.outputs.core }}
      ui: ${{ steps.filter.outputs.ui }}
      plugins: ${{ steps.filter.outputs.plugins }}
      portable: ${{ steps.filter.outputs.portable }}
      audio: ${{ steps.filter.outputs.audio }}
      rt: ${{ steps.filter.outputs.rt }}
      bwf: ${{ steps.filter.outputs.bwf }}
      full: ${{ steps.filter.outputs.full }}
      harness_only: ${{ steps.filter.outputs.harness_only }}
      image_build: ${{ steps.filter.outputs.image_build }}
      image_ui: ${{ steps.filter.outputs.image_ui }}
      image_rtsan: ${{ steps.filter.outputs.image_rtsan }}
      image_plugins: ${{ steps.filter.outputs.image_plugins }}
      image_runtime: ${{ steps.filter.outputs.image_runtime }}
      image_bwfreaders: ${{ steps.filter.outputs.image_bwfreaders }}
      image_labwc: ${{ steps.filter.outputs.image_labwc }}
      image_labwc_input: ${{ steps.filter.outputs.image_labwc_input }}
      image_systemd: ${{ steps.filter.outputs.image_systemd }}
      micro_build: ${{ steps.filter.outputs.micro_build }}
      micro_label: ${{ steps.filter.outputs.micro_label }}
      rtsan_label: ${{ steps.filter.outputs.rtsan_label }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # A PR whose files are all planning/, brain/, docs/ or Markdown cannot
      # change a build, so the heavy jobs below are skipped (a skipped job
      # counts as passing for branch protection, and `gh pr checks` buckets it
      # "skipping", which tools/merge-when-green.sh does not treat as failing).
      # On the PR merge commit, HEAD^1 is the base, so this is the PR's diff.
      # Pushes to main always build everything.
      - name: Does the change touch anything but documentation?
        id: filter
        run: |
          code=true
          # Images come prebuilt from images.yml (main only); a change to an
          # image's inputs, or to the tooling that builds or pulls images,
          # must be built here, as the published one is the old one.
          # Also on main, where images.yml runs in parallel with this.
          tooling='\.github/actions/sonora-image/.*|\.github/workflows/images\.yml'
          files=$(git diff --no-renames --name-only HEAD^1 HEAD || true)
          for pair in build:tools/Dockerfile.build \
                      ui:'tools/Dockerfile.ui|audio-stack/pipewire-sonora.conf' \
                      rtsan:tools/Dockerfile.rtsan \
                      plugins:tools/Dockerfile.plugins \
                      bwfreaders:tools/Dockerfile.bwfreaders \
                      labwc:'tools/Dockerfile.labwc|iso/auto/config' \
                      labwc_input:tools/Dockerfile.labwc-input \
                      systemd:tools/Dockerfile.systemd-test \
                      runtime:'tools/Dockerfile.runtime|audio-stack/pipewire-sonora.conf|iso/config/archives/sonora-(backports\.list|backports\.pref|snapshot\.conf)\.chroot|tools/(test-engine-entrypoint\.sh|verify-recording\.py|test-quantum-entrypoint\.sh|jack-quantum-probe\.py)'; do
            if printf '%s\n' "$files" | grep -qE "^(${pair#*:}|${tooling})$"; then
              echo "image_${pair%%:*}=true" >> "$GITHUB_OUTPUT"
            else
              echo "image_${pair%%:*}=false" >> "$GITHUB_OUTPUT"
            fi
          done
          if [ "${{ github.event_name }}" = pull_request ]; then
            if [ -n "$files" ] && ! printf '%s\n' "$files" |
                 grep -qvE '^(planning|brain|docs)/|\.md$'; then
              code=false
            fi
            printf '%s\n' "$files"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

          # The micro build jobs are named for what they do (owner,
          # 2026-11-07); "Gate" below is the one stable name to require.
          micro_label=$(printf '%s\n' "$files" | tools/ci-micro-label.sh build)
          rtsan_label=$(printf '%s\n' "$files" | tools/ci-micro-label.sh rtsan)
          case "$micro_label" in Nothing*) echo "micro_build=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "micro_build=true" >> "$GITHUB_OUTPUT" ;; esac
          echo "micro_label=$micro_label" >> "$GITHUB_OUTPUT"
          echo "rtsan_label=$rtsan_label" >> "$GITHUB_OUTPUT"
          echo "$micro_label / $rtsan_label"

          # Which heavy jobs this PR can affect. With six jobs running at
          # once for the whole repository, a plugin-only or UI-only PR that
          # ran the sanitizers, PipeWire and Ardour jobs held the queue for
          # every other PR (2026-11-04: 40 PRs, 60+ jobs queued). A skipped
          # job counts as passing. Main always runs everything, and anything
          # not classified below (build system, workflows, the scripts these
          # jobs run) counts as everything.
          #   core:     engine, common, drivers, contracts
          #   ui:       ui/ and the key maps
          #   plugins:  plugins/
          #   portable: what the MSVC job builds (common/, plugins/native)
          #   audio:    the audio stack the record and quantum jobs exercise
          #   rt:       the real-time call graph RTSan checks (engine,
          #             drivers, common, the native processors and client)
          #   bwf:      what writes the takes third-party readers judge
          #   full:     main runs every job and every test (owner,
          #             2026-11-04: no nightly; PRs test only their context)
          all='core=true ui=true plugins=true portable=true audio=true rt=true bwf=true'
          core=false ui=false plugins=false portable=false audio=false
          rt=false bwf=false full=false
          # harness_only: every file is the harness's own (the daemon, its
          # library and tests, the dashboard, the heavy lock, the agent
          # files, planning, brain, docs). Such a PR runs the Harness job
          # and the cheap catalogue checks, not the Shell-scripts job with
          # its GHCR images and container tests (2026-11-07). The map:
          # harness scripts the Sonora build depends on are NOT harness-only
          # and build everything: tools/build-*.sh (build-slot.sh excepted,
          # it is the lock, tested by tools/test-build-slot.sh in the Harness
          # job), tools/micro-build.sh, tools/Dockerfile*, tools/*-entrypoint.sh.
          harness_only=false
          if [ "${{ github.event_name }}" = pull_request ] && [ -n "$files" ] &&
             ! printf '%s\n' "$files" | grep -qvE '^(planning|brain|docs|\.claude)/|\.md$|^tools/(harness/|harness[^/]*\.py$|orchestrator\.py$|supervisor\.py$|check_syntax\.py$|dashboard[^/]*$|build-slot\.sh$|test-build-slot\.sh$)'; then
            harness_only=true
          fi
          echo "harness_only=$harness_only" >> "$GITHUB_OUTPUT"
          echo "harness_only=$harness_only"
          if [ "${{ github.event_name }}" != pull_request ] || [ -z "$files" ]; then
            eval "$all"; full=true
          elif [ "$code" = true ]; then
            while IFS= read -r f; do
              case "$f" in
                planning/*|brain/*|docs/*|*.md) ;;
                tools/build-slot.sh|tools/test-build-slot.sh|tools/supervisor.py|tools/check_syntax.py) ;;
                engine/core/*|common/audiofile/*) core=true rt=true bwf=true ;;
                engine/*|drivers/*) core=true rt=true ;;
                contracts/*) core=true ;;
                common/*) core=true portable=true rt=true ;;
                ui/*|keymaps/*) ui=true ;;
                plugins/native/*|plugins/client/*|plugins/sdk/*) plugins=true portable=true rt=true ;;
                plugins/*) plugins=true ;;
                audio-stack/*) audio=true ;;
                # Checked by the cheap jobs (shellcheck, progress, modes),
                # which always run: the image, the harness, the dashboard,
                # Windows scripts and scripts no heavy job runs.
                iso/*|.claude/*|tools/harness/*|tools/harness*.py|tools/orchestrator.py) ;;
                tools/dashboard*|tools/*.ps1|tools/*.lua|planning/orchestrator/*) ;;
                tools/build-*|tools/test-engine-docker.sh|tools/test-bwf-interop.sh) eval "$all" ;;
                tools/test-quantum-pin.sh|tools/rtsan-*|tools/failed-take-quit.py|tools/crash-recovery-kill.py) eval "$all" ;;
                # What runs inside the heavy jobs' containers.
                tools/*-entrypoint.sh|tools/verify-recording.py|tools/test-bwf-interop-record.sh) eval "$all" ;;
                tools/Dockerfile*|tools/*.cmake|tools/*.supp) eval "$all" ;;
                tools/*) ;;
                *) eval "$all" ;;
              esac
            done <<< "$files"
          fi
          for k in core ui plugins portable audio rt bwf full; do
            echo "$k=${!k}" >> "$GITHUB_OUTPUT"
            echo "$k=${!k}"
          done

  modes:
    name: Executable bits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # These files are committed from Windows, where there is no exec bit, so
      # git records 100644 unless someone sets it explicitly. live-build
      # silently ignores a non-executable auto/config and hooks, which would
      # cost us the RT kernel flavour on a fresh clone and look like nothing
      # at all. Checked rather than remembered.
      - name: Every script must be executable in the index
        run: |
          missing=0
          for f in tools/*.sh tools/*.py iso/auto/config                    iso/config/hooks/normal/*.hook.chroot                    iso/config/includes.chroot/usr/local/bin/*; do
            mode=$(git ls-files -s "$f" | cut -d' ' -f1)
            if [ "$mode" != "100755" ]; then
              echo "::error file=$f::mode $mode, expected 100755."
              echo "  fix with: git update-index --chmod=+x $f"
              missing=1
            fi
          done
          exit "$missing"

  progress:
    name: Progress catalogue
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A done item without evidence, or a doing item without a branch,
      # fails here. PROGRESS.md is not compared: it is regenerated on main.
      - name: Catalogue valid
        run: python3 tools/progress.py --check

      # The "this PR" -> "PR #N" rewrite and the squash-subject parsing that
      # publish-progress relies on on main, where a bug could not be caught.
      - name: progress.py doctests
        run: python3 -m doctest -v tools/progress.py

      # Agents set progress with `set`, so on the real catalogue it must
      # change one line and leave a file --check accepts.
      - name: progress.py set edits one line
        run: |
          id=$(python3 tools/progress.py list --open | awk '$2 == "todo" { print $1; exit }')
          python3 tools/progress.py set "$id" doing --branch ci/set-check
          python3 tools/progress.py set "$id" done --pr 1 --evidence "set check"
          python3 tools/progress.py get "$id"
          python3 tools/progress.py --check
          test "$(git diff --numstat planning/progress.json)" = "$(printf '1\t1\tplanning/progress.json')"
          if python3 tools/progress.py set no.such.item todo; then exit 1; fi
          git checkout -- planning/progress.json

      # Every PR that regenerated PROGRESS.md conflicted with every other
      # queued PR, so only the publish-progress job below writes it.
      - name: PR leaves PROGRESS.md alone
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # The checked-out ref is the PR merged into *current* main, which
          # carries main's own PROGRESS.md regenerations; compare the PR head.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --name-only "$BASE_SHA"..."$HEAD_SHA" | grep -qx 'planning/PROGRESS.md'; then
            echo "::error file=planning/PROGRESS.md::PRs must not change PROGRESS.md; CI regenerates it on main after the merge."
            echo "  fix with: git checkout origin/main -- planning/PROGRESS.md"
            exit 1
          fi

  publish-progress:
    name: Regenerate PROGRESS.md on main
    # Only after a merge, never in a PR. The bot's own commit carries
    # [skip ci], and the actor check stops a loop should that ever be lost.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.actor != 'github-actions[bot]'
    needs: progress
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # Two merges in quick succession must not race to push; the later run
    # regenerates from the later main, so the earlier one can be dropped.
    concurrency:
      group: publish-progress
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # A PR cannot know its number before it is opened, so its evidence
      # says "this PR"; the squash subject's "(#N)" suffix names it here.
      - name: Resolve "this PR" in evidence
        run: |
          subject=$(git log -1 --format=%s)
          pr=$(python3 tools/progress.py --pr-from-subject "$subject")
          if [ -n "$pr" ]; then
            python3 tools/progress.py --resolve-this-pr "$pr"
          else
            echo "No (#N) in the head subject; evidence left as is."
          fi

      - name: Regenerate
        run: python3 tools/progress.py --markdown

      - name: Commit if it changed
        run: |
          if git diff --quiet -- planning/progress.json planning/PROGRESS.md; then
            echo "progress.json and PROGRESS.md already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add planning/progress.json planning/PROGRESS.md
          git commit -m "Regenerate PROGRESS.md [skip ci]"
          git push origin HEAD:main

  shellcheck:
    name: Shell scripts
    needs: changes
    # A harness-only PR runs the Harness job instead (its shellcheck covers
    # the lock script); a skipped job counts as passing.
    if: needs.changes.outputs.harness_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The test images below are built on main by images.yml; this job pulls
      # them, and builds one only when the change edits its inputs.
      - name: Read the image snapshot date
        id: labwc_snap
        run: echo "snap=$(sed -nE 's/^SONORA_SNAPSHOT=([0-9]{8}T[0-9]{6}Z)$/\1/p' iso/auto/config)" >> "$GITHUB_OUTPUT"
      - name: Get the sonora-labwc-test image (pulled from GHCR)
        uses: ./.github/actions/sonora-image
        with:
          name: sonora-labwc-test
          dockerfile: tools/Dockerfile.labwc
          context: tools
          build-args: --build-arg SNAP=${{ steps.labwc_snap.outputs.snap }}
          rebuild: ${{ needs.changes.outputs.image_labwc }}
      - name: Get the sonora-labwc-input image (pulled from GHCR)
        uses: ./.github/actions/sonora-image
        with:
          name: sonora-labwc-input
          dockerfile: tools/Dockerfile.labwc-input
          context: tools
          rebuild: ${{ needs.changes.outputs.image_labwc_input }}
      - name: Get the sonora-systemd-test image (pulled from GHCR)
        uses: ./.github/actions/sonora-image
        with:
          name: sonora-systemd-test
          dockerfile: tools/Dockerfile.systemd-test
          context: tools
          rebuild: ${{ needs.changes.outputs.image_systemd }}
      - name: Install shellcheck and dbus-x11
        run: for d in 0 15 45; do sleep "$d"; sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 update && sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 install -y shellcheck dbus-x11 && exit 0; done; echo "apt failed after 3 attempts" >&2; exit 1
      # -x follows `source=` directives, so tools/lib/* sourced by a script is
      # checked in that script's context (tools/test-image-config.sh's parts).
      - name: Check
        run: shellcheck -x tools/*.sh iso/auto/config iso/config/hooks/normal/*.hook.chroot iso/config/includes.chroot/usr/local/bin/sonora-smoketest iso/config/includes.chroot/usr/local/bin/sonora-display-gave-up iso/config/includes.chroot/usr/local/bin/sonora-install iso/config/includes.chroot/usr/local/bin/sonora-install-tty iso/config/includes.chroot/usr/local/bin/sonora-update iso/config/includes.chroot/usr/local/lib/sonora/slots.sh iso/config/includes.chroot/usr/local/bin/sonora-policycheck iso/config/includes.chroot/usr/local/bin/sonora-acceptance iso/config/includes.chroot/usr/local/bin/sonora-windows-plugins

      # ADR-0007 M5: module include edges and the contract lock. Seconds,
      # no build needed.
      - name: Module dependency check (ADR-0007 §1)
        run: |
          tools/check-deps.sh --test
          tools/check-deps.sh

      - name: Every module with tests has a ctest label (ADR-0007 §7)
        run: |
          tools/check-test-labels.sh --test
          tools/check-test-labels.sh

      - name: Contract files match contracts/CONTRACTS.lock (ADR-0007 §6)
        run: |
          tools/contracts-lock.sh --test
          tools/contracts-lock.sh

      - name: Read-only root, capped RAM writes
        run: tools/test-ro-root.sh

      - name: Build slot limiter
        run: tools/test-build-slot.sh

      - name: Secure Boot chain, static
        run: tools/test-secure-boot.sh

      - name: Installed root, swap sizing and fstab
        run: tools/test-rootfs.sh

      - name: Update policy files
        run: tools/test-updates.sh

      - name: A/B updates, slot logic against files
        run: tools/test-ab-updates.sh

      - name: Policy check items match the image script
        run: tools/test-policycheck-qemu.sh --static

      - name: Merge gate decisions, against a fake gh
        run: tools/test-merge-checks.sh

      - name: dev-wsl.sh wsl.conf edit, session bus check, --log
        run: tools/test-dev-wsl.sh

      - name: RT limits agree across limits.d, unit and hook
        run: tools/test-rt-limits.sh

      - name: RT tuning (rtirq, cpu-latency, USB audio udev rule)
        run: tools/test-rt-tuning.sh

      - name: umc-measure.sh logic, against fake arecord/pw-jack/engine
        run: tools/test-umc-measure.sh

      - name: UMC1820 WirePlumber rule parses and matches fake nodes
        run: tools/test-umc-profile.sh

      - name: sonora-acceptance logic, against a fake /proc, /sys and engine
        run: tools/test-sonora-acceptance.sh

      - name: Image config (backports pins, RT kernel, tty1 session, no VT gettys)
        run: tools/test-image-config.sh

      - name: Image build pre-flight logic (pins, retry, dev-snapshot gate)
        run: tools/test-iso-preflight.sh

      - name: Installer text screen (tty2) against a stub installer
        run: tools/test-installer-tty.sh

      # labwc 0.8.3 headless: Ctrl+Alt+Fn reaches the UI (srvrkeys:none, through
      # a nested labwc's own keymap); an X11 editor's title bar and close button.
      - name: labwc input (Ctrl+Alt+Fn, title-bar drag, close button)
        env:
          SONORA_LABWC_INPUT_IMAGE_BUILT: "1"
        run: tools/test-labwc-input.sh

      # The shipped units under a real systemd (PID 1 in a container): the
      # display fallback hands tty1 back to the session; systemd-analyze verify.
      - name: Display fallback units under systemd
        env:
          SONORA_SYSTEMD_IMAGE_BUILT: "1"
        run: tools/test-display-fallback.sh

      # The shipped rc.xml under headless labwc 0.8.3, against a run with
      # labwc's defaults: no compositor chord or desktop menu, clicks reach the UI.
      - name: labwc kiosk bindings (keys, desktop menu, client clicks)
        env:
          SONORA_LABWC_IMAGE_BUILT: "1"
        run: tools/test-labwc-kiosk.sh

      # The image installs the copies under iso/, not audio-stack/ itself, so
      # an edit that skipped tools/sync-audio-stack.sh would ship the old
      # tuning while every container test (which reads audio-stack/) passed.
      - name: The image's audio-stack copies match audio-stack/
        run: |
          dest=iso/config/includes.chroot/usr/share/sonora
          drift=0
          for f in audio-stack/*; do
            name=$(basename "$f")
            [ "$name" = README.md ] && continue
            if ! cmp -s "$f" "$dest/$name"; then
              echo "::error file=$dest/$name::not byte-identical to $f."
              echo "  fix with: tools/sync-audio-stack.sh"
              drift=1
            fi
          done
          exit "$drift"

  # The per-PR gate (ADR-0061): the CMake targets the changed files reach,
  # built, and only their tests run, in the build image GHCR holds (the Qt
  # one when ui/ is touched). A docs or harness PR skips it (a skipped job
  # counts as passing). Linking the application, the sanitizers, the
  # interop suites, the Windows build, the slow tests and the ISO run once a
  # day on main (nightly.yml), never per PR.
  micro:
    name: ${{ needs.changes.outputs.micro_label }}
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true' && needs.changes.outputs.micro_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # ccache seeded by nightly.yml (job "Seed ccache") from main, one per
      # image: a PR restores the newest seed and never saves, so its
      # entries cannot evict main's from the repository's cache quota.
      - name: Restore the ccache seed
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache-micro
          key: micro-ccache-${{ needs.changes.outputs.ui == 'true' && 'ui' || 'build' }}-${{ github.sha }}
          restore-keys: micro-ccache-${{ needs.changes.outputs.ui == 'true' && 'ui' || 'build' }}-
      - name: Get the sonora-build image (pulled from GHCR)
        uses: ./.github/actions/sonora-image
        with:
          name: sonora-build
          dockerfile: tools/Dockerfile.build
          context: tools
          rebuild: ${{ needs.changes.outputs.image_build }}
      - name: Get the sonora-ui image (pulled from GHCR)
        if: needs.changes.outputs.ui == 'true'
        uses: ./.github/actions/sonora-image
        with:
          name: sonora-ui
          dockerfile: tools/Dockerfile.ui
          context: .
          rebuild: ${{ needs.changes.outputs.image_ui }}
      - name: Build the affected targets, run their tests
        env:
          SONORA_HEAVY_HELD: "1"
        run: |
          export SONORA_CCACHE_DIR="$HOME/.ccache-micro" CCACHE_MAXSIZE=4G
          tools/micro-build.sh --base origin/main --no-rtsan
      - name: The plan (what was built and tested)
        if: always()
        run: cat .micro-build/plan.json 2>/dev/null || echo "no plan (nothing to build)"

  # The real-time rule, per PR but on the affected targets only: a change in
  # the RT call graph runs those targets' tests under RealtimeSanitizer.
  micro-rtsan:
    name: ${{ needs.changes.outputs.rtsan_label }}
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.rt == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A host directory owned by the runner user: the default docker volume
      # is root-owned and ccache (running as the runner uid) gets EACCES.
      - uses: actions/cache@v4
        with:
          path: ~/.ccache-micro-rtsan
          key: micro-rtsan-ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: micro-rtsan-ccache-${{ runner.os }}-
      - name: Get the sonora-build image (pulled from GHCR, for the plan)
        uses: ./.github/actions/sonora-image
        with:
          name: sonora-build
          dockerfile: tools/Dockerfile.build
          context: tools
          rebuild: ${{ needs.changes.outputs.image_build }}
      # The plan is made in the Qt image when ui/ is touched; the script
      # never builds an image on GitHub.
      - name: Get the sonora-ui image (pulled from GHCR, for the plan)
        if: needs.changes.outputs.ui == 'true'
        uses: ./.github/actions/sonora-image
        with:
          name: sonora-ui
          dockerfile: tools/Dockerfile.ui
          context: .
          rebuild: ${{ needs.changes.outputs.image_ui }}
      - name: Get the sonora-rtsan image (pulled from GHCR)
        uses: ./.github/actions/sonora-image
        with:
          name: sonora-rtsan
          dockerfile: tools/Dockerfile.rtsan
          context: tools
          rebuild: ${{ needs.changes.outputs.image_rtsan }}
      - name: RTSan on the affected targets
        env:
          SONORA_HEAVY_HELD: "1"
          SONORA_RTSAN_IMAGE_BUILT: "1"
        run: |
          export SONORA_CCACHE_DIR="$HOME/.ccache-micro-rtsan"
          tools/micro-build.sh --base origin/main --rtsan-only

  # The one check to require: green when the micro build jobs above passed
  # or were skipped (nothing to build). Its name does not change with the
  # PR; the jobs' names do.
  gate:
    name: Gate
    needs: [changes, micro, micro-rtsan]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every micro build job passed or was skipped
        env:
          RESULTS: ${{ needs.micro.result }} ${{ needs.micro-rtsan.result }} ${{ needs.changes.result }}
          LABEL: ${{ needs.changes.outputs.micro_label }}
        run: |
          echo "### Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "$LABEL ($RESULTS)" >> "$GITHUB_STEP_SUMMARY"
          case " $RESULTS " in *failure*|*cancelled*) exit 1 ;; esac

  # The orchestrator daemon, its broker and supervisor (ADR-0047), against a
  # fake claude; the heavy lock script. For a harness-only PR this is the
  # whole CI (see harness_only in `changes`).
  harness:
    name: Harness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install shellcheck
        run: for d in 0 15 45; do sleep "$d"; sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 update && sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 install -y shellcheck && exit 0; done; echo "apt failed after 3 attempts" >&2; exit 1
      - name: Workflows parse as YAML
        run: |
          python -m pip install --quiet pyyaml
          python tools/check_syntax.py yaml .github/workflows/*.yml
      - name: Harness shell scripts
        run: shellcheck tools/build-slot.sh tools/test-build-slot.sh tools/micro-build.sh tools/micro-build-entrypoint.sh tools/ci-micro-label.sh tools/dashboard-up.sh
      - name: Build slot limiter
        run: tools/test-build-slot.sh
      - name: Harness unit tests
        # Output goes to a file, not the step's pipes: a child that outlives
        # the suite then cannot keep the step open until the job timeout,
        # which leaves no log (2026-11-08, #515: three 20-minute runs, no
        # trace). The log names every test, is printed whole, and any
        # survivor is listed; the kill at 10 min is well under the job's 15.
        run: |
          set +e
          timeout -s KILL 600 python -m unittest discover -s tools/harness/tests -v > harness-tests.log 2>&1
          rc=$?
          cat harness-tests.log
          echo "unittest exit=$rc"
          echo "--- processes still alive after the suite:"
          ps -eo pid,ppid,etimes,cmd --forest | grep -v "ps -eo"
          exit $rc
