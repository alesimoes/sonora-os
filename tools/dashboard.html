<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="dash-token" content="__DASH_TOKEN__">
<title>Sonora Console</title>
<link rel="icon" type="image/svg+xml" href="/static/dash-logo.svg">
<link rel="stylesheet" href="/static/console.css">
</head>
<body data-pane="chat">
<header class="strip" id="strip" aria-label="Estado geral"></header>
<div class="offline" id="offline" hidden>sem conexão, reenviando</div>
<nav class="tabs" id="tabs" aria-label="Painéis"></nav>
<div class="main">
  <aside class="side l" aria-label="Agentes em execução">
    <section class="sec sec-nums">
      <div class="sh"><span>Progresso</span></div>
      <div id="prog"></div>
      <div class="sh sp"><span>PRs abertos</span><b id="prcount"></b></div>
      <div id="prlist"></div>
    </section>
    <section class="sec sec-ag">
      <div class="sh sp"><span>Agentes</span><b id="agcount"></b></div>
      <div id="agents"></div>
    </section>
  </aside>
  <section class="chat" aria-label="Conversa com o orquestrador">
    <div class="log" id="log" role="log" aria-live="polite"></div>
    <button class="chip-new" id="newer" type="button" hidden>novas ↓</button>
    <div class="comp">
      <div class="to" id="to"></div>
      <div class="sug" id="sug"></div>
      <form class="row" id="form" autocomplete="off">
        <input id="inp" aria-label="Mensagem" enterkeyhint="send">
        <button class="btn go" type="submit">Enviar</button>
      </form>
    </div>
  </section>
  <aside class="side r" aria-label="Fila de atenção">
    <div class="sh"><span>Precisa de você</span><b id="atcount"></b></div>
    <div id="attn"></div>
    <div id="hcare"></div>
  </aside>
</div>
<script src="/static/console-core.js"></script>
<script src="/static/console-panels.js"></script>
<script src="/static/console-kpis.js"></script>
<script src="/static/console-cards.js"></script>
<script src="/static/console-chat.js"></script>
</body>
</html>
