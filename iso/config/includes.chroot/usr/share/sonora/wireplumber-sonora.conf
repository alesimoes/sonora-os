# Installed as /etc/wireplumber/wireplumber.conf.d/99-sonora.conf
#
# Two things, both of which decide whether a multichannel interface is usable
# at all. Verified by reading WirePlumber 0.5.8's own scripts, not guessed:
# the rule shape comes from scripts/device/find-preferred-profile.lua and the
# state hook names from the mixin.stateless block in wireplumber.conf.

# --- 1. prefer the Pro Audio profile on every sound card ---
#
# Without this, PipeWire presents a multichannel interface through its default
# profile, which is a stereo pair. A Behringer UMC1820 shows up as two
# channels, and the other sixteen inputs simply do not exist as far as the
# engine can see -- not as silent tracks, not as an error, they are absent.
#
# The Pro Audio profile exposes every channel as an individual port, with no
# routing, no mixing and no resampling in the way. That is what a recorder
# wants and the only profile where channel counts are honest.
device.profile.priority.rules = [
  {
    matches = [
      {
        device.name = "~alsa_card.*"
      }
    ]
    actions = {
      update-props = {
        # Tried in order; the first one the card actually offers wins. A card
        # with no Pro Audio profile falls through to WirePlumber's own
        # selection rather than ending up with nothing.
        priorities = [ "pro-audio" ]
      }
    }
  }
]

# --- 2. do not remember runtime changes across reboots ---
#
# WirePlumber stores the selected profile and restores it on the next run, and
# find-stored-profile runs before find-preferred-profile, so a stored stereo
# profile would quietly outrank the preference above for the life of the
# machine.
#
# An appliance should boot the same way every time. This is what WirePlumber
# calls mixin.stateless, and its own comment describes it as being for
# embedded systems that always reboot to a default state. The ready-made
# main-embedded profile is not used because it also pulls in
# mixin.systemwide-session, and ours runs in the user session.
wireplumber.profiles = {
  main = {
    hooks.device.profile.state = disabled
    hooks.device.routes.state = disabled
    hooks.default-nodes.state = disabled
    hooks.stream.state = disabled
  }
}
