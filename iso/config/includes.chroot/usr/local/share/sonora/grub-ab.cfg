# A/B slot selection (ADR-0044). Included by the installed grub.cfg. The same
# decision is slots_boot_choice in /usr/local/lib/sonora/slots.sh;
# tools/test-ab-updates.sh keeps the two in step.
load_env sonora_slot sonora_trial sonora_tries sonora_valid_a sonora_valid_b
if [ -z "$sonora_slot" ]; then
  set sonora_slot=a
fi
set sonora_boot="$sonora_slot"
if [ -n "$sonora_trial" ]; then
  if [ "$sonora_tries" = 0 -o -z "$sonora_tries" ]; then
    # Out of tries: the trial slot never confirmed. Forget it.
    if [ "$sonora_trial" = a ]; then set sonora_valid_a=0; else set sonora_valid_b=0; fi
    set sonora_trial=
    save_env sonora_trial sonora_valid_a sonora_valid_b
  else
    # Spent before the boot, so a hang counts as a failed try. GRUB has no
    # arithmetic, hence the ladder; SLOTS_TRIES is 3.
    if [ "$sonora_tries" = 3 ]; then set sonora_tries=2
    elif [ "$sonora_tries" = 2 ]; then set sonora_tries=1
    else set sonora_tries=0
    fi
    save_env sonora_tries
    set sonora_boot="$sonora_trial"
  fi
fi
menuentry "Sonora (slot $sonora_boot)" {
  # Both slots carry /live/filesystem.squashfs; live-media pins the one this
  # entry means, or live-boot would take whichever it finds first.
  search --no-floppy --label --set=root sonora-$sonora_boot
  linux /live/vmlinuz boot=live live-media=/dev/disk/by-label/sonora-$sonora_boot sonora.slot=$sonora_boot quiet
  initrd /live/initrd.img
}
