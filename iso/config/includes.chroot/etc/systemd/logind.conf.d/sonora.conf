# By default logind starts a getty on tty2-tty6 when the console switches to
# one (autovt@). The sonora account has no password and pam_unix has nullok,
# so Ctrl+Alt+F2 then "sonora" at the prompt is a shell without a password.
# The operator must never reach a shell. tty1 belongs to sonora-session.service
# and, from ADR-0010 stage 2, tty2 to the terminal UI. Neither needs a getty.
#
# A getty for debugging is still one kernel parameter away for someone at the
# boot menu: systemd.wants=getty@tty3.service.
[Login]
NAutoVTs=0
ReserveVT=0
