# Installed as /etc/sysctl.d/99-sonora.conf

# Do not let the kernel swap out an audio process to grow the page cache. A
# swapped-out buffer is a disk read inside the callback.
vm.swappiness = 10

# Writeback thresholds. The defaults let a large amount of dirty data pile up
# and then flush in one burst, which stalls our disk thread long enough to
# overrun a ring. Flushing earlier and more often trades throughput for the
# steadiness a recorder needs.
vm.dirty_background_ratio = 3
vm.dirty_ratio = 10

# The engine opens a file per track and the session may hold many.
fs.inotify.max_user_watches = 524288
