# Real-time privileges for the audio group.
#
# rtprio 95 and not 99: leaving headroom above us means a runaway audio thread
# cannot lock out the kernel threads that would let anyone recover the machine.
#
# memlock unlimited matters more than it looks. A page fault on the audio
# thread is a disk wait inside the callback, which is an xrun. Locking the
# buffers into RAM is what makes the no-blocking rule actually hold.
@audio   -  rtprio      95
@audio   -  memlock     unlimited
@audio   -  nice        -19
