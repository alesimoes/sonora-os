# Drop-in: /etc/pipewire/pipewire.conf.d/99-sonora.conf
#
# ADR-0003: the quantum is our block size, so it is pinned. Left to dynamic
# negotiation PipeWire changes it while a session is running, which changes the
# latency compensation under our feet mid-take.
context.properties = {
    default.clock.rate          = 48000
    # Only rates we are prepared to run a session at. Offering 44100 here
    # invites a device to pull the server to a rate the session did not ask
    # for; the engine would then refuse to start, which is correct but
    # confusing at boot.
    default.clock.allowed-rates = [ 48000 96000 ]

    default.clock.quantum       = 128
    default.clock.min-quantum   = 64
    # min and max are equal on purpose: this is the pin.
    default.clock.max-quantum   = 128
}

context.modules = [
    { name = libpipewire-module-rt
      args = {
          nice.level   = -11
          rt.prio      = 88
          rt.time.soft = 200000
          rt.time.hard = 200000
      }
      flags = [ ifexists nofail ]
    }
]
