# Drop-in: /etc/pipewire/pipewire.conf.d/99-sonora.conf
#
# ADR-0003: the quantum is our block size, so it is pinned. Left to dynamic
# negotiation PipeWire changes it while a session is running, which changes the
# latency compensation under our feet mid-take. Since ADR-0007 M2 the engine
# treats a buffer-size or rate change during a take as fatal to the take, so
# the pin has to hold against every client, not just be the default.
#
# Each knob below closes a route that was measured to move the graph in
# PipeWire 1.4.2 (tools/test-quantum-pin.sh, brain/research/quantum-pin.md).
context.properties = {
    default.clock.rate          = 48000
    # 48000 only. A device or client asking for another rate gets resampled
    # rather than moving the graph. 96000 used to be listed; with it, a forced
    # rate switch re-clocked every node mid-take. Recording at 96 kHz is a
    # configuration change made between sessions, not a negotiation.
    default.clock.allowed-rates = [ 48000 ]

    # min, max and default are equal on purpose: this is the pin.
    default.clock.quantum       = 128
    default.clock.min-quantum   = 128
    default.clock.max-quantum   = 128
    # min/max do not bound a *forced* quantum; the floor does. Belt and braces
    # behind node.rules below, for any downward route not listed there.
    default.clock.quantum-floor = 128

    # Reject clock.force-quantum / clock.force-rate written to the settings
    # metadata unless the value is inside the limits above. That is the route
    # jack_set_buffer_size() takes for clients with jack.global-buffer-size,
    # and `pw-metadata -n settings 0 clock.force-quantum N`. It also means
    # force-quantum is no longer an operator override: to change the block
    # size, edit this file and restart PipeWire between sessions.
    settings.check-quantum      = true
    settings.check-rate         = true
}

# A client can force the graph through its own node properties
# (PIPEWIRE_QUANTUM=, jack_set_buffer_size(), jack_set_sample_rate()), and the
# server honours node.force-quantum / node.force-rate without checking them
# against min/max or allowed-rates. These rules run on the server every time a
# node's properties change, after the client's update, and delete both keys.
# node.force-rate is deleted rather than set to 0: 0 means "force my
# node.rate", which would reopen the hole.
node.rules = [
    {
        matches = [ { node.force-quantum = "!null" } ]
        actions = { update-props = { node.force-quantum = null } }
    }
    {
        matches = [ { node.force-rate = "!null" } ]
        actions = { update-props = { node.force-rate = null } }
    }
]

context.modules = [
    { name = libpipewire-module-rt
      args = {
          nice.level   = -11
          rt.prio      = 88
          rt.time.soft = 200000
          rt.time.hard = 200000
      }
      flags = [ ifexists nofail ]
    }
]
